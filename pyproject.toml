[project]
name = "nomad"
version = "0.1.0"
description = "Agentic harness integrating Obsidian with LangChain DeepAgents and Fireworks AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.0",
    "langchain-fireworks>=1.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
]

[project.scripts]
nomad = "nomad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
